<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArreglaYa</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  background:white;
}

header{
  padding:18px 20px;
  background:#111827;
  color:white;
}

header h1{
  margin:0;
  font-size:25px;
}

main{
  padding:20px;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #0000000d;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 16px;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:white;
  width:100%;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
  width:100%;
  margin-top:8px;
}

.hidden{
  display:none !important;
}

.cat{
  background:#f3f4f6;
  margin:5px;
  padding:12px;
  border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.status{
  padding:12px;
  border-radius:8px;
  background:#f3f4f6;
  margin-top:10px;
}

.small{
  font-size:13px;
  color:#6b7280;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:#f3f4f6;
}

h2{
  margin-top:5px;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr;
  }

  main{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>🔧 ArreglaYa</h1>
</header>

<main>

<!-- AUTENTICACIÓN -->

<section id="auth">

<div class="card">

<h2>Bienvenido a ArreglaYa</h2>

<p>
Encuentra profesionales para tus reparaciones
o recibe trabajos como profesional.
</p>

<label>Email</label>
<input
  id="email"
  type="email"
  autocomplete="email"
  placeholder="tu@email.com"
>

<label>Contraseña</label>
<input
  id="password"
  type="password"
  autocomplete="new-password"
  placeholder="Mínimo 6 caracteres"
>

<label>Nombre</label>
<input
  id="name"
  type="text"
  autocomplete="name"
  placeholder="Tu nombre"
>

<label>Tipo de cuenta</label>

<select id="userType">
  <option value="cliente">Cliente</option>
  <option value="profesional">Profesional</option>
</select>

<button
  id="registerButton"
  class="primary"
  type="button"
>
Crear cuenta
</button>

<button
  id="loginButton"
  class="secondary"
  type="button"
>
Iniciar sesión
</button>

<p id="authMessage" class="message hidden"></p>

</div>

</section>


<!-- APLICACIÓN -->

<section id="app" class="hidden">

<div class="card">

<h2 id="welcome"></h2>

<button
  id="logoutButton"
  class="secondary"
  type="button"
>
Cerrar sesión
</button>

</div>


<!-- CLIENTE -->

<div id="clientPanel" class="hidden">

<div class="card">

<h2>¿Qué necesitas?</h2>

<div class="grid">

<button class="cat" data-service="Fontanería">
🔧 Fontanería
</button>

<button class="cat" data-service="Electricidad">
💡 Electricidad
</button>

<button class="cat" data-service="Pintura">
🎨 Pintura
</button>

<button class="cat" data-service="Carpintería">
🪚 Carpintería
</button>

<button class="cat" data-service="Limpieza">
🧹 Limpieza
</button>

<button class="cat" data-service="Otros">
🛠️ Otros
</button>

</div>

</div>


<div id="requestForm" class="card hidden">

<h2>Crear solicitud</h2>

<label>Servicio</label>

<input
  id="service"
  readonly
>

<label>Describe lo que necesitas</label>

<textarea
  id="description"
  rows="5"
  placeholder="Explica el trabajo..."
></textarea>

<label>Ciudad</label>

<input
  id="city"
  value="Madrid"
>

<label>Presupuesto aproximado</label>

<input
  id="price"
  type="number"
  min="0"
  placeholder="€"
>

<button
  id="createRequestButton"
  class="primary"
  type="button"
>
Enviar solicitud
</button>

<p id="requestMessage" class="message hidden"></p>

</div>


<div class="card">

<h2>Mis solicitudes</h2>

<div id="myRequests">
Cargando...
</div>

</div>

</div>


<!-- PROFESIONAL -->

<div id="professionalPanel" class="hidden">

<div class="card">

<h2>Perfil profesional</h2>

<label>Profesión</label>

<input
  id="profession"
  placeholder="Fontanero, electricista..."
>

<label>Descripción</label>

<textarea
  id="professionalDescription"
  rows="4"
  placeholder="Describe tus servicios"
></textarea>

<label>Precio desde</label>

<input
  id="priceFrom"
  type="number"
  min="0"
  placeholder="Precio desde (€)"
>

<button
  id="saveProfessionalButton"
  class="primary"
  type="button"
>
Guardar perfil
</button>

<p
  id="professionalMessage"
  class="message hidden"
></p>

</div>


<div class="card">

<h2>Solicitudes disponibles</h2>

<div id="availableRequests">
Cargando...
</div>

</div>


<div class="card">

<h2>Mis trabajos</h2>

<div id="myJobs">
Cargando...
</div>

</div>

</div>

</section>

</main>

</div>


<script type="module">

/*
  ARREGLAYA + SUPABASE

  IMPORTANTE:
  Sustituye TU_PUBLISHABLE_KEY por tu clave
  sb_publishable_...

  NO pongas aquí una sb_secret_...
*/

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://yljevtkreoefhojrgcny.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_FsZpWdEvCii3fTf8";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentType = null;


/* =========================
   ELEMENTOS
========================= */

const authSection =
  document.getElementById("auth");

const appSection =
  document.getElementById("app");

const authMessage =
  document.getElementById("authMessage");

const requestMessage =
  document.getElementById("requestMessage");

const professionalMessage =
  document.getElementById("professionalMessage");


/* =========================
   MENSAJES
========================= */

function showMessage(element, message){

  element.textContent = message;
  element.classList.remove("hidden");

}


/* =========================
   REGISTRO
========================= */

async function register(){

  try{

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const userType =
      document
        .getElementById("userType")
        .value;


    if(!email || !password || !name){

      showMessage(
        authMessage,
        "Completa todos los campos."
      );

      return;
    }


    if(password.length < 6){

      showMessage(
        authMessage,
        "La contraseña debe tener al menos 6 caracteres."
      );

      return;
    }


    showMessage(
      authMessage,
      "Creando cuenta..."
    );


    const { data, error } =
      await supabase.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            full_name:name,
            user_type:userType
          }
        }

      });


    if(error){

      showMessage(
        authMessage,
        "Error: " + error.message
      );

      return;
    }


    if(data.session){

      showMessage(
        authMessage,
        "Cuenta creada correctamente. Entrando..."
      );

      await loadApp(data.user);

    }else{

      showMessage(
        authMessage,
        "Cuenta creada. Revisa tu correo si Supabase solicita confirmar el email."
      );

    }

  }catch(error){

    console.error(error);

    showMessage(
      authMessage,
      "Ha ocurrido un error: " + error.message
    );

  }

}


/* =========================
   INICIAR SESIÓN
========================= */

async function login(){

  try{

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if(!email || !password){

      showMessage(
        authMessage,
        "Escribe tu email y contraseña."
      );

      return;
    }


    showMessage(
      authMessage,
      "Iniciando sesión..."
    );


    const { data, error } =
      await supabase.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(error){

      showMessage(
        authMessage,
        "Error: " + error.message
      );

      return;
    }


    await loadApp(data.user);


  }catch(error){

    console.error(error);

    showMessage(
      authMessage,
      "Ha ocurrido un error: " + error.message
    );

  }

}


/* =========================
   CERRAR SESIÓN
========================= */

async function logout(){

  await supabase.auth.signOut();

  currentUser = null;
  currentType = null;

  appSection.classList.add("hidden");
  authSection.classList.remove("hidden");

  showMessage(
    authMessage,
    "Sesión cerrada."
  );

}


/* =========================
   CARGAR APLICACIÓN
========================= */

async function loadApp(user){

  if(!user){
    return;
  }


  currentUser = user;

  currentType =
    user.user_metadata?.user_type || "cliente";


  authSection.classList.add("hidden");

  appSection.classList.remove("hidden");


  document.getElementById("welcome")
    .textContent =
      "Hola, " +
      (
        user.user_metadata?.full_name ||
        "usuario"
      ) +
      " 👋";


  document
    .getElementById("clientPanel")
    .classList.add("hidden");


  document
    .getElementById("professionalPanel")
    .classList.add("hidden");


  if(currentType === "profesional"){

    document
      .getElementById("professionalPanel")
      .classList.remove("hidden");


    await loadProfessionalProfile();

    await loadAvailableRequests();

    await loadMyJobs();

  }else{

    document
      .getElementById("clientPanel")
      .classList.remove("hidden");


    await loadMyRequests();

  }

}


/* =========================
   ELEGIR SERVICIO
========================= */

function chooseService(service){

  document
    .getElementById("requestForm")
    .classList.remove("hidden");


  document
    .getElementById("service")
    .value = service;


  document
    .getElementById("requestForm")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   CREAR SOLICITUD
========================= */

async function createRequest(){

  try{

    if(!currentUser){

      showMessage(
        requestMessage,
        "Debes iniciar sesión."
      );

      return;
    }


    const service =
      document
        .getElementById("service")
        .value;


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const city =
      document
        .getElementById("city")
        .value
        .trim();


    const price =
      document
        .getElementById("price")
        .value;


    if(!service){

      showMessage(
        requestMessage,
        "Selecciona un servicio."
      );

      return;
    }


    if(!description){

      showMessage(
        requestMessage,
        "Describe el trabajo que necesitas."
      );

      return;
    }


    showMessage(
      requestMessage,
      "Enviando solicitud..."
    );


    const { error } =
      await supabase
        .from("service_requests")
        .insert({

          client_id:currentUser.id,

          service:service,

          description:description,

          city:city,

          price:
            price
              ? Number(price)
              : null

        });


    if(error){

      showMessage(
        requestMessage,
        "Error: " + error.message
      );

      return;
    }


    showMessage(
      requestMessage,
      "✅ Solicitud enviada correctamente."
    );


    document
      .getElementById("description")
      .value = "";


    document
      .getElementById("price")
      .value = "";


    await loadMyRequests();


  }catch(error){

    console.error(error);

    showMessage(
      requestMessage,
      "Error: " + error.message
    );

  }

}


/* =========================
   MIS SOLICITUDES
========================= */

async function loadMyRequests(){

  const container =
    document.getElementById("myRequests");


  if(!currentUser){

    container.textContent =
      "No hay usuario conectado.";

    return;
  }


  const { data, error } =
    await supabase
      .from("service_requests")
      .select("*")
      .eq("client_id", currentUser.id)
      .order("created_at", {
        ascending:false
      });


  if(error){

    container.textContent =
      "Error: " + error.message;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      "<p class='small'>Todavía no tienes solicitudes.</p>";

    return;
  }


  container.innerHTML =
    data.map(r => `

      <div class="status">

        <strong>
          ${escapeHtml(r.service)}
        </strong>

        <br>

        ${escapeHtml(
          r.description || ""
        )}

        <br>

        <span class="small">

          ${escapeHtml(
            r.city || ""
          )}

          · Estado:

          ${escapeHtml(
            r.status || "pendiente"
          )}

        </span>

      </div>

    `).join("");

}


/* =========================
   PERFIL PROFESIONAL
========================= */

async function saveProfessionalProfile(){

  try{

    if(!currentUser){

      showMessage(
        professionalMessage,
        "Debes iniciar sesión."
      );

      return;
    }


    const profession =
      document
        .getElementById("profession")
        .value
        .trim();


    const description =
      document
        .getElementById("professionalDescription")
        .value
        .trim();


    const priceFrom =
      document
        .getElementById("priceFrom")
        .value;


    if(!profession){

      showMessage(
        professionalMessage,
        "Escribe tu profesión."
      );

      return;
    }


    const { error } =
      await supabase
        .from("professional_profiles")
        .upsert({

          id:currentUser.id,

          profession:profession,

          description:description,

          price_from:
            priceFrom
              ? Number(priceFrom)
              : null

        });


    if(error){

      showMessage(
        professionalMessage,
        "Error: " + error.message
      );

      return;
    }


    showMessage(
      professionalMessage,
      "✅ Perfil guardado correctamente."
    );


  }catch(error){

    console.error(error);

    showMessage(
      professionalMessage,
      "Error: " + error.message
    );

  }

}


/* =========================
   CARGAR PERFIL PROFESIONAL
========================= */

async function loadProfessionalProfile(){

  const { data, error } =
    await supabase
      .from("professional_profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();


  if(error){

    console.error(
      "Error cargando perfil:",
      error
    );

    return;
  }


  if(!data){
    return;
  }


  document
    .getElementById("profession")
    .value =
      data.profession || "";


  document
    .getElementById("professionalDescription")
    .value =
      data.description || "";


  document
    .getElementById("priceFrom")
    .value =
      data.price_from ?? "";

}


/* =========================
   SOLICITUDES DISPONIBLES
========================= */

async function loadAvailableRequests(){

  const container =
    document.getElementById(
      "availableRequests"
    );


  const { data, error } =
    await supabase
      .from("service_requests")
      .select("*")
      .eq("status","pendiente")
      .is("professional_id",null)
      .order("created_at",{
        ascending:false
      });


  if(error){

    container.textContent =
      "Error: " + error.message;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      "<p class='small'>No hay solicitudes disponibles.</p>";

    return;
  }


  container.innerHTML =
    data.map(r => `

      <div class="status">

        <strong>
          ${escapeHtml(r.service)}
        </strong>

        <br>

        ${escapeHtml(
          r.description || ""
        )}

        <br>

        <span class="small">

          ${escapeHtml(
            r.city || ""
          )}

        </span>

        <br><br>

        <button
          class="primary"
          type="button"
          data-job-id="${escapeHtml(r.id)}"
        >
          Aceptar trabajo
        </button>

      </div>

    `).join("");


  container
    .querySelectorAll("[data-job-id]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => acceptJob(
          button.dataset.jobId
        )
      );

    });

}


/* =========================
   ACEPTAR TRABAJO
========================= */

async function acceptJob(id){

  try{

    const { error } =
      await supabase
        .from("service_requests")
        .update({

          professional_id:
            currentUser.id,

          status:"aceptada"

        })
        .eq("id",id)
        .eq("status","pendiente")
        .is("professional_id",null);


    if(error){

      alert(
        "Error: " + error.message
      );

      return;
    }


    await loadAvailableRequests();

    await loadMyJobs();


  }catch(error){

    console.error(error);

    alert(
      "Error: " + error.message
    );

  }

}


/* =========================
   MIS TRABAJOS
========================= */

async function loadMyJobs(){

  const container =
    document.getElementById("myJobs");


  const { data, error } =
    await supabase
      .from("service_requests")
      .select("*")
      .eq(
        "professional_id",
        currentUser.id
      )
      .order("created_at",{
        ascending:false
      });


  if(error){

    container.textContent =
      "Error: " + error.message;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      "<p class='small'>Todavía no tienes trabajos.</p>";

    return;
  }


  container.innerHTML =
    data.map(r => `

      <div class="status">

        <strong>
          ${escapeHtml(r.service)}
        </strong>

        <br>

        ${escapeHtml(
          r.description || ""
        )}

        <br>

        <span class="small">

          Estado:

          ${escapeHtml(
            r.status || ""
          )}

        </span>

      </div>

    `).join("");

}


/* =========================
   SEGURIDAD HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   EVENTOS DE BOTONES
========================= */

document
  .getElementById("registerButton")
  .addEventListener(
    "click",
    register
  );


document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    logout
  );


document
  .getElementById("createRequestButton")
  .addEventListener(
    "click",
    createRequest
  );


document
  .getElementById("saveProfessionalButton")
  .addEventListener(
    "click",
    saveProfessionalProfile
  );


document
  .querySelectorAll(".cat")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => chooseService(
        button.dataset.service
      )
    );

  });


/* =========================
   COMPROBAR SESIÓN EXISTENTE
========================= */

try{

  const {
    data,
    error
  } =
    await supabase.auth.getSession();


  if(error){

    console.error(
      "Error obteniendo sesión:",
      error
    );

  }else if(data.session){

    await loadApp(
      data.session.user
    );

  }

}catch(error){

  console.error(
    "Error iniciando aplicación:",
    error
  );

}

</script>

</body>
</html>

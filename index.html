<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArreglaYa</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.app{max-width:700px;margin:auto;min-height:100vh;background:white}
header{padding:18px 20px;background:#111827;color:white}
header h1{margin:0;font-size:25px}
main{padding:20px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0000000d}
input,select,textarea{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 16px;font-size:16px;cursor:pointer}
.primary{background:#2563eb;color:white;width:100%}
.secondary{background:#e5e7eb;color:#111827;width:100%;margin-top:8px}
.hidden{display:none}
.cat{background:#f3f4f6;margin:5px;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr}
.status{padding:10px;border-radius:8px;background:#f3f4f6;margin-top:10px}
.small{font-size:13px;color:#6b7280}
h2{margin-top:5px}
</style>
</head>

<body>
<div class="app">

<header>
<h1>🔧 ArreglaYa</h1>
</header>

<main>

<section id="auth">
<div class="card">
<h2>Bienvenido a ArreglaYa</h2>
<p>Encuentra profesionales para tus reparaciones o recibe trabajos como profesional.</p>

<label>Email</label>
<input id="email" type="email" placeholder="tu@email.com">

<label>Contraseña</label>
<input id="password" type="password" placeholder="Mínimo 6 caracteres">

<label>Nombre</label>
<input id="name" placeholder="Tu nombre">

<label>Tipo de cuenta</label>
<select id="userType">
<option value="cliente">Cliente</option>
<option value="profesional">Profesional</option>
</select>

<button class="primary" onclick="register()">Crear cuenta</button>
<button class="secondary" onclick="login()">Iniciar sesión</button>

<p id="authMessage" class="small"></p>
</div>
</section>

<section id="app" class="hidden">

<div class="card">
<h2 id="welcome"></h2>
<button class="secondary" onclick="logout()">Cerrar sesión</button>
</div>

<div id="clientPanel" class="hidden">

<div class="card">
<h2>¿Qué necesitas?</h2>

<div class="grid">
<button class="cat" onclick="chooseService('Fontanería')">🔧 Fontanería</button>
<button class="cat" onclick="chooseService('Electricidad')">💡 Electricidad</button>
<button class="cat" onclick="chooseService('Pintura')">🎨 Pintura</button>
<button class="cat" onclick="chooseService('Carpintería')">🪚 Carpintería</button>
<button class="cat" onclick="chooseService('Limpieza')">🧹 Limpieza</button>
<button class="cat" onclick="chooseService('Otros')">🛠️ Otros</button>
</div>

</div>

<div id="requestForm" class="card hidden">
<h2>Crear solicitud</h2>

<label>Servicio</label>
<input id="service" readonly>

<label>Describe lo que necesitas</label>
<textarea id="description" rows="5" placeholder="Explica el trabajo..."></textarea>

<label>Ciudad</label>
<input id="city" value="Madrid">

<label>Presupuesto aproximado</label>
<input id="price" type="number" placeholder="€">

<button class="primary" onclick="createRequest()">Enviar solicitud</button>

<p id="requestMessage" class="small"></p>
</div>

<div class="card">
<h2>Mis solicitudes</h2>
<div id="myRequests">Cargando...</div>
</div>

</div>

<div id="professionalPanel" class="hidden">

<div class="card">
<h2>Perfil profesional</h2>

<input id="profession" placeholder="Profesión">
<textarea id="professionalDescription" rows="4" placeholder="Describe tus servicios"></textarea>
<input id="priceFrom" type="number" placeholder="Precio desde (€)">

<button class="primary" onclick="saveProfessionalProfile()">Guardar perfil</button>

<p id="professionalMessage" class="small"></p>
</div>

<div class="card">
<h2>Solicitudes disponibles</h2>
<div id="availableRequests">Cargando...</div>
</div>

<div class="card">
<h2>Mis trabajos</h2>
<div id="myJobs">Cargando...</div>
</div>

</div>

</section>

</main>
</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://yljevtkreoefhojrgcny.supabase.co";

const SUPABASE_KEY = FsZpWdEvCii3fTf8_KEY;

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentType = null;

async function register(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const name = document.getElementById("name").value.trim();
  const userType = document.getElementById("userType").value;

  if(!email || !password || !name){
    showAuth("Completa todos los campos.");
    return;
  }

  const {error} = await supabase.auth.signUp({
    email,
    password,
    options:{
      data:{
        full_name:name,
        user_type:userType
      }
    }
  });

  if(error){
    showAuth(error.message);
    return;
  }

  showAuth(
    "Cuenta creada. Si Supabase pide confirmar tu email, revisa tu correo."
  );
}

async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const {data,error} = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showAuth(error.message);
    return;
  }

  await loadApp(data.user);
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

function showAuth(message){
  document.getElementById("authMessage").textContent = message;
}

async function loadApp(user){

  currentUser = user;
  currentType = user.user_metadata?.user_type || "cliente";

  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Hola, " + (user.user_metadata?.full_name || "usuario") + " 👋";

  if(currentType === "profesional"){
    document.getElementById("professionalPanel").classList.remove("hidden");
    await loadProfessionalProfile();
    await loadAvailableRequests();
    await loadMyJobs();
  }else{
    document.getElementById("clientPanel").classList.remove("hidden");
    await loadMyRequests();
  }
}

window.register = register;
window.login = login;
window.logout = logout;

window.chooseService = function(service){

  document.getElementById("requestForm").classList.remove("hidden");
  document.getElementById("service").value = service;

  document.getElementById("requestForm")
    .scrollIntoView({behavior:"smooth"});
};

window.createRequest = async function(){

  const service = document.getElementById("service").value;
  const description = document.getElementById("description").value.trim();
  const city = document.getElementById("city").value.trim();
  const price = document.getElementById("price").value;

  if(!description){
    document.getElementById("requestMessage").textContent =
      "Describe el trabajo que necesitas.";
    return;
  }

  const {error} = await supabase
    .from("service_requests")
    .insert({
      client_id:currentUser.id,
      service,
      description,
      city,
      price:price ? Number(price) : null
    });

  if(error){
    document.getElementById("requestMessage").textContent =
      error.message;
    return;
  }

  document.getElementById("requestMessage").textContent =
    "✅ Solicitud enviada correctamente.";

  document.getElementById("description").value = "";
  document.getElementById("price").value = "";

  await loadMyRequests();
};

async function loadMyRequests(){

  const {data,error} = await supabase
    .from("service_requests")
    .select("*")
    .eq("client_id",currentUser.id)
    .order("created_at",{ascending:false});

  const container = document.getElementById("myRequests");

  if(error){
    container.textContent = error.message;
    return;
  }

  if(!data.length){
    container.innerHTML =
      "<p class='small'>Todavía no tienes solicitudes.</p>";
    return;
  }

  container.innerHTML = data.map(r => `
    <div class="status">
      <strong>${escapeHtml(r.service)}</strong>
      <br>${escapeHtml(r.description || "")}
      <br>
      <span class="small">
      ${escapeHtml(r.city || "")} · Estado: ${escapeHtml(r.status)}
      </span>
    </div>
  `).join("");
}

window.saveProfessionalProfile = async function(){

  const profession = document.getElementById("profession").value.trim();
  const description =
    document.getElementById("professionalDescription").value.trim();

  const priceFrom =
    document.getElementById("priceFrom").value;

  if(!profession){
    document.getElementById("professionalMessage").textContent =
      "Escribe tu profesión.";
    return;
  }

  const {error} = await supabase
    .from("professional_profiles")
    .upsert({
      id:currentUser.id,
      profession,
      description,
      price_from:priceFrom ? Number(priceFrom) : null
    });

  document.getElementById("professionalMessage").textContent =
    error ? error.message : "✅ Perfil guardado.";
};

async function loadProfessionalProfile(){

  const {data} = await supabase
    .from("professional_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(!data) return;

  document.getElementById("profession").value =
    data.profession || "";

  document.getElementById("professionalDescription").value =
    data.description || "";

  document.getElementById("priceFrom").value =
    data.price_from || "";
}

async function loadAvailableRequests(){

  const {data,error} = await supabase
    .from("service_requests")
    .select("*")
    .eq("status","pendiente")
    .is("professional_id",null)
    .order("created_at",{ascending:false});

  const container = document.getElementById("availableRequests");

  if(error){
    container.textContent = error.message;
    return;
  }

  if(!data.length){
    container.innerHTML =
      "<p class='small'>No hay solicitudes disponibles.</p>";
    return;
  }

  container.innerHTML = data.map(r => `
    <div class="status">
      <strong>${escapeHtml(r.service)}</strong>
      <br>${escapeHtml(r.description || "")}
      <br>
      <span class="small">
      ${escapeHtml(r.city || "")}
      </span>
      <br><br>
      <button onclick="acceptJob('${r.id}')">
      Aceptar trabajo
      </button>
    </div>
  `).join("");
}

window.acceptJob = async function(id){

  const {error} = await supabase
    .from("service_requests")
    .update({
      professional_id:currentUser.id,
      status:"aceptada"
    })
    .eq("id",id)
    .eq("status","pendiente")
    .is("professional_id",null);

  if(error){
    alert(error.message);
    return;
  }

  await loadAvailableRequests();
  await loadMyJobs();
};

async function loadMyJobs(){

  const {data,error} = await supabase
    .from("service_requests")
    .select("*")
    .eq("professional_id",currentUser.id)
    .order("created_at",{ascending:false});

  const container = document.getElementById("myJobs");

  if(error){
    container.textContent = error.message;
    return;
  }

  if(!data.length){
    container.innerHTML =
      "<p class='small'>Todavía no tienes trabajos.</p>";
    return;
  }

  container.innerHTML = data.map(r => `
    <div class="status">
      <strong>${escapeHtml(r.service)}</strong>
      <br>${escapeHtml(r.description || "")}
      <br>
      <span class="small">
      Estado: ${escapeHtml(r.status)}
      </span>
    </div>
  `).join("");
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const {data:{session}} =
  await supabase.auth.getSession();

if(session){
  await loadApp(session.user);
}

</script>

</body>
</html>
